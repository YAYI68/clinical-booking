# Render Blueprint: deploys the API as a Docker web service.
services:
  - type: web
    name: clinic-booking-api
    runtime: docker
    rootDir: api
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
